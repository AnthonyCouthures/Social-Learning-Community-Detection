[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "social-learning-community-detection"
dynamic = ["version"]
description = "Decentralized community detection with nonlinear social learning dynamics (SER, RNP, RNP-DC)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Couthures", email = "anthony.couthures@uclouvain.be" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
]
keywords = ["community detection", "networks", "opinion dynamics", "consensus", "graph clustering", "networkx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["social-learning-community-detection[test]", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/AnthonyCouthures/Social-Learning-Community-Detection"
Issues = "https://github.com/AnthonyCouthures/Social-Learning-Community-Detection/issues"

[tool.hatch.version]
path = "src/slcd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/slcd"]

[tool.hatch.build.targets.sdist]
include = ["src/slcd", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["src/slcd"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["slcd", "common"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/slcd"]
exclude = ["src/slcd/tests/"]
